name: Stage 1 isolated client repair

on:
  push:
    branches: [client-portal]
    paths: [scripts/stage1-repair.py, .github/workflows/stage1-repair.yml]

permissions:
  contents: read

jobs:
  apply:
    if: github.ref == 'refs/heads/client-portal'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact branch-local repairs
        id: commit
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/client-portal
          git merge-base --is-ancestor b9a819f96489f33736326999b2abecb8da3f3ad4 HEAD
          python3 scripts/stage1-repair.py
          git diff --check
          git add server.ts src/server/store.ts src/server/clientAuthority.ts src/server/clientFiles.ts src/types/clientPortal.ts src/services/api.ts src/components/client/ClientPortal.tsx scripts/stage1-firebase.json
          git rm scripts/stage1-repair.py
          git -c user.name='ProInspect branch maintenance' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: harden client identity, secure booking claims and transactional document workflows'
          git push origin HEAD:refs/heads/client-portal
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIREBASE_PROJECT_ID: demo-stage1
      GCLOUD_PROJECT: demo-stage1
      FIRESTORE_DATABASE_ID: '(default)'
      FIREBASE_STORAGE_BUCKET: demo-stage1.appspot.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Isolated Auth and Firestore workflow/security tests
        timeout-minutes: 8
        run: npx --yes firebase-tools@latest emulators:exec --only auth,firestore --project demo-stage1 --config scripts/stage1-firebase.json 'npx tsx scripts/verify-stage1.ts'
      - run: docker build -t proinspect-stage1-client .
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform -chdir=infrastructure fmt -check -recursive
      - run: terraform -chdir=infrastructure init -backend=false -input=false
      - run: terraform -chdir=infrastructure validate
      - name: Record source and test output
        if: always()
        run: git rev-parse HEAD > stage1-source-sha.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage1-client-evidence
          path: |
            stage1-source-sha.txt
            stage1-server.log
          retention-days: 3
          if-no-files-found: error
