name: Stage 3 implementation verification
on:
  push:
    branches: [stage3/infrastructure-rehearsal]
    paths: [.github/workflows/stage3-install.yml, '.stage3-transfer/**']
permissions:
  contents: write
concurrency:
  group: stage3-implementation-install
  cancel-in-progress: false
jobs:
  verify-and-record:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - name: Install reviewed source payload and persisted-timestamp regression
        shell: python
        run: |
          import hashlib, json, lzma, os, pathlib, shutil, subprocess
          assert os.environ['GITHUB_REF'] == 'refs/heads/stage3/infrastructure-rehearsal'
          root = pathlib.Path('.')
          parts = sorted(root.glob('.stage3-transfer/part*.xz'))
          assert len(parts) == 7
          raw = b''.join(p.read_bytes() for p in parts)
          assert hashlib.sha256(raw).hexdigest() == '564611896f06614fd5a6c4d87e6b6e42728e5ecdff73468fdf8a2862a157096a'
          payload = json.loads(lzma.decompress(raw))
          assert payload['base'] == '401817592cc186259940e46aa3459fa5a511ee1f'
          subprocess.run(['git','merge-base','--is-ancestor',payload['base'],'HEAD'],check=True)
          assert '.github/' not in payload['patch']
          subprocess.run(['git','apply','--check','-'],input=payload['patch'],text=True,check=True)
          subprocess.run(['git','apply','-'],input=payload['patch'],text=True,check=True)
          for name, text in payload['files'].items():
              path = pathlib.PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts
              assert path.parts[0] not in ('.git','.github')
              target = root / path
              assert not target.exists(), name
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(text, encoding='utf-8')
          p = root / 'scripts/stage3/tests/emulator.mjs'
          text = p.read_text()
          old = '  const before=await snapshot(db), plan=planMigration(before,context);'
          assert old in text
          text = text.replace(old, "  // Firestore truncates timestamps to microseconds when initially stored.\n  // Compare against the persisted source, not the higher-precision SDK input.\n  const storedTimestamp=(await db.doc('auditEvents/a').get()).data().occurredAt;\n" + old)
          old = "assert.equal((await db.doc('auditEvents/a').get()).data().occurredAt.nanoseconds,987654321);"
          assert old in text
          text = text.replace(old, "assert.ok((await db.doc('auditEvents/a').get()).data().occurredAt.isEqual(storedTimestamp));")
          p.write_text(text)
          shutil.rmtree('.stage3-transfer')
          pathlib.Path('.stage3').mkdir(exist_ok=True)
      - name: Application regressions
        run: |
          set -euo pipefail
          npm ci
          npm run lint
          npm run freeze:check
          npm run stage2:check
          npm run stage3:test | tee .stage3/unit-tests.log
          npm audit --omit=dev --audit-level=high
      - name: Terraform provider and mock verification
        run: |
          set -euo pipefail
          terraform -chdir=infrastructure fmt -check -recursive
          terraform -chdir=infrastructure init -backend=false -input=false 2>&1 | tee .stage3/terraform-init.log
          terraform -chdir=infrastructure validate 2>&1 | tee .stage3/terraform-validate.log
          terraform -chdir=infrastructure test -no-color 2>&1 | tee .stage3/terraform-test.log
      - name: Actual Firestore emulator rehearsal
        timeout-minutes: 8
        run: |
          set -euo pipefail
          npx --yes firebase-tools@14.2.1 emulators:exec --only firestore --project demo-stage3 --config firebase.stage3.json 'npm run stage3:test:emulator' 2>&1 | tee .stage3/emulator.log
      - name: Production build compatibility
        run: |
          set -euo pipefail
          npm run build
          docker build -t proinspect-stage3:verify .
      - name: Record verified implementation on Stage 3 branch only
        run: |
          set -euo pipefail
          git config user.name 'ProInspect Stage 3 automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --name-only | grep '^.github/'; then
            echo 'Unexpected workflow modification'; exit 1
          fi
          git diff --cached --check
          git commit -m 'feat(stage3): implement infrastructure convergence and guarded staging migration services'
          git push origin HEAD:refs/heads/stage3/infrastructure-rehearsal
          git rev-parse HEAD > .stage3/recorded-commit.txt
      - name: Collect verification evidence
        if: always()
        run: |
          mkdir -p .stage3
          cp infrastructure/.terraform.lock.hcl .stage3/terraform.lock.hcl 2>/dev/null || true
          git status --short > .stage3/worktree-status.txt
          git bundle create .stage3/source.bundle --all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage3-implementation-evidence
          path: |
            .stage3/*.log
            .stage3/*.txt
            .stage3/*.hcl
            .stage3/*.bundle
          include-hidden-files: true
          retention-days: 1
          compression-level: 0
