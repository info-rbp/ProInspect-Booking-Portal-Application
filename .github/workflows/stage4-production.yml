name: Stage 4 production cutover

on:
  push:
    branches: [release/platform-unification, main]
    paths: [ops/stage4-production-request.json]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: proinspect-production-cutover
  cancel-in-progress: false

jobs:
  request:
    name: Production readiness and request validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      action: ${{ steps.request.outputs.action }}
      source: ${{ steps.request.outputs.sourceSha }}
      release: ${{ steps.request.outputs.releaseId }}
      approval: ${{ steps.request.outputs.approve }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate source, request and actual GitHub production protections
        id: request
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/stage4/request.py

  production:
    name: Approved production operation
    needs: request
    if: needs.request.outputs.action != 'disabled'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      ACTION: ${{ needs.request.outputs.action }}
      SOURCE_SHA: ${{ needs.request.outputs.source }}
      RELEASE_ID: ${{ needs.request.outputs.release }}
      APPROVAL: ${{ needs.request.outputs.approval }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact production source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.request.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate production identity settings before Google authentication
        env:
          PROJECT_ID: ${{ vars.GCP_PRODUCTION_PROJECT_ID }}
          TERRAFORM_SA: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        run: |
          python3 - <<'PY'
          import os,re
          if os.environ.get('PROJECT_ID') != 'business-plan-applicatio-17047':
              raise SystemExit('GCP_PRODUCTION_PROJECT_ID does not match the frozen production project.')
          if os.environ.get('TERRAFORM_SA') != 'proinspect-prod-terraform@business-plan-applicatio-17047.iam.gserviceaccount.com':
              raise SystemExit('GCP_TERRAFORM_SERVICE_ACCOUNT does not match the reviewed Terraform identity.')
          provider=os.environ.get('WIF_PROVIDER','')
          if not re.fullmatch(r'projects/696236368989/locations/global/workloadIdentityPools/[a-z0-9-]{4,32}/providers/[a-z0-9-]{4,32}', provider):
              raise SystemExit('GCP_WORKLOAD_IDENTITY_PROVIDER is not a full provider resource in the production project.')
          PY
      - name: Validate private descriptor before any Google authentication
        if: needs.request.outputs.action != 'readiness' && needs.request.outputs.action != 'federation'
        env:
          CONFIG_B64: ${{ secrets.STAGE4_PRODUCTION_CONFIG_B64 }}
          PROJECT_ID: ${{ vars.GCP_PRODUCTION_PROJECT_ID }}
          TERRAFORM_SA: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          RECEIPT_B64: ${{ secrets.STAGE4_OPERATOR_RECEIPT_B64 }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import base64, json, os, pathlib, sys
          sys.path.insert(0,'scripts/stage4')
          from common import validate, PROJECT, require, save
          required=['CONFIG_B64','PROJECT_ID','TERRAFORM_SA','WIF_PROVIDER']
          missing=[k for k in required if not os.environ.get(k)]
          require(not missing,'Missing production environment settings: '+', '.join(missing))
          config=json.loads(base64.b64decode(os.environ['CONFIG_B64'],validate=True))
          require(os.environ['PROJECT_ID']==PROJECT==config.get('projectId'),'Incorrect production project.')
          require(os.environ['TERRAFORM_SA']==config['terraform']['terraform_service_account_email'],'Terraform identity mismatch.')
          require(config['sourceSha']==os.environ['SOURCE_SHA'] and config['releaseId']==os.environ['RELEASE_ID'],
              'Descriptor source/release must match the reviewed request; it is never silently rewritten.')
          validate(config)
          save('infrastructure/environments/production.local.json',config)
          if os.environ.get('RECEIPT_B64'):
              receipt=json.loads(base64.b64decode(os.environ['RECEIPT_B64'],validate=True))
              save('private-evidence/stage4-operator.private.json',receipt)
          PY
          python3 scripts/stage4/release.py validate --config infrastructure/environments/production.local.json
      - name: Verify exact-source CI before issuing Google credentials
        run: |
          python3 - <<'PY'
          import os,sys
          sys.path.insert(0,'scripts/stage4')
          from common import verify_ci
          verify_ci(os.environ['SOURCE_SHA'])
          PY
      - name: Show non-secret GitHub OIDC claims
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.parse, urllib.request
          provider=os.environ["WIF_PROVIDER"]
          audience="https://iam.googleapis.com/"+provider
          url=os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          sep="&" if "?" in url else "?"
          req=urllib.request.Request(
              url+sep+"audience="+urllib.parse.quote(audience,safe=""),
              headers={"Authorization":"bearer "+os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
          with urllib.request.urlopen(req,timeout=30) as response:
              token=json.load(response)["value"]
          payload=token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims=json.loads(base64.urlsafe_b64decode(payload.encode()))
          allowed=["sub","aud","repository","repository_id","repository_owner","repository_owner_id",
                   "ref","ref_type","workflow","workflow_ref","job_workflow_ref","environment",
                   "event_name","run_id","run_attempt"]
          print("OIDC_CLAIMS="+json.dumps({k:claims.get(k) for k in allowed if k in claims},
                                          sort_keys=True,separators=(",",":")))
          PY
      - name: Keyless production Google authentication
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PRODUCTION_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}
          create_credentials_file: true
      - uses: google-github-actions/setup-gcloud@v3
      - name: Extend reviewed GitHub federation to Cloudflare release workflows
        if: needs.request.outputs.action == 'federation'
        env:
          TERRAFORM_SA: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        run: |
          set -euo pipefail
          EXPECTED_APPROVAL="CLOUDFLARE-WIF:$SOURCE_SHA"
          test "$APPROVAL" = "$EXPECTED_APPROVAL" || { echo "Exact Cloudflare federation approval token required." >&2; exit 1; }
          POOL="proinspect-property-services"
          PROVIDER="github"
          PROJECT="business-plan-applicatio-17047"
          LEGACY="google.subject == 'repo:info-rbp@235419395/ProInspect-Platform@1390107826:environment:production' && attribute.repository_id == '1390107826' && attribute.repository_owner_id == '235419395' && attribute.repository == 'info-rbp/ProInspect-Platform' && ((attribute.ref == 'refs/heads/release/platform-unification' && attribute.workflow_ref == 'info-rbp/ProInspect-Platform/.github/workflows/stage4-production.yml@refs/heads/release/platform-unification') || (attribute.ref == 'refs/heads/main' && attribute.workflow_ref == 'info-rbp/ProInspect-Platform/.github/workflows/stage4-production.yml@refs/heads/main'))"
          UPDATED="attribute.repository_id == '1390107826' && attribute.repository_owner_id == '235419395' && attribute.repository == 'info-rbp/ProInspect-Platform' && ((google.subject == 'repo:info-rbp@235419395/ProInspect-Platform@1390107826:environment:production' && ((attribute.ref == 'refs/heads/release/platform-unification' && attribute.workflow_ref == 'info-rbp/ProInspect-Platform/.github/workflows/stage4-production.yml@refs/heads/release/platform-unification') || (attribute.ref == 'refs/heads/main' && attribute.workflow_ref == 'info-rbp/ProInspect-Platform/.github/workflows/stage4-production.yml@refs/heads/main') || (attribute.ref == 'refs/heads/release/cloudflare-platform' && attribute.workflow_ref == 'info-rbp/ProInspect-Platform/.github/workflows/cloudflare-production.yml@refs/heads/release/cloudflare-platform'))) || (google.subject == 'repo:info-rbp@235419395/ProInspect-Platform@1390107826:environment:staging' && attribute.ref == 'refs/heads/release/cloudflare-platform' && attribute.workflow_ref == 'info-rbp/ProInspect-Platform/.github/workflows/cloudflare-staging.yml@refs/heads/release/cloudflare-platform'))"
          CURRENT="$(gcloud iam workload-identity-pools providers describe "$PROVIDER" --project="$PROJECT" --location=global --workload-identity-pool="$POOL" --format='value(attributeCondition)')"
          if [ "$CURRENT" != "$LEGACY" ] && [ "$CURRENT" != "$UPDATED" ]; then
            echo "Existing provider condition differs from both reviewed states; refusing overwrite." >&2
            exit 1
          fi
          if [ "$CURRENT" != "$UPDATED" ]; then
            gcloud iam workload-identity-pools providers update-oidc "$PROVIDER"               --project="$PROJECT"               --location=global               --workload-identity-pool="$POOL"               --attribute-condition="$UPDATED"               --quiet
          fi
          VERIFIED="$(gcloud iam workload-identity-pools providers describe "$PROVIDER" --project="$PROJECT" --location=global --workload-identity-pool="$POOL" --format='value(attributeCondition)')"
          test "$VERIFIED" = "$UPDATED"
          echo "Cloudflare staging and production workflows are now explicitly admitted by the reviewed provider condition."
      - name: Read-only production discovery
        if: needs.request.outputs.action == 'readiness'
        env:
          PROJECT_ID: ${{ vars.GCP_PRODUCTION_PROJECT_ID }}
          TERRAFORM_SA: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        run: |
          python3 scripts/stage4/discover.py \
            --template infrastructure/environments/production.example.json \
            --output /tmp/stage4-production-discovery.json \
            --source-sha "$SOURCE_SHA" \
            --release-id "$RELEASE_ID" \
            --terraform-sa "$TERRAFORM_SA" \
            --wif-provider "$WIF_PROVIDER"
      - name: Retain non-secret production discovery
        if: needs.request.outputs.action == 'readiness'
        uses: actions/upload-artifact@v4
        with:
          name: stage4-production-discovery
          path: /tmp/stage4-production-discovery.json
          retention-days: 1
          if-no-files-found: error
      - uses: actions/setup-node@v4
        if: needs.request.outputs.action != 'readiness' && needs.request.outputs.action != 'federation'
        with:
          node-version: '22.16.0'
          cache: npm
      - uses: hashicorp/setup-terraform@v3
        if: needs.request.outputs.action != 'readiness' && needs.request.outputs.action != 'federation'
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - name: Install the locked application dependencies
        if: needs.request.outputs.action != 'readiness' && needs.request.outputs.action != 'federation'
        run: npm ci
      - name: Verify immutable build bootstrap prerequisites
        if: needs.request.outputs.action == 'build'
        env:
          TERRAFORM_SA: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}
          PROJECT_ID: ${{ vars.GCP_PRODUCTION_PROJECT_ID }}
        run: |
          python3 - <<'PY'
          import json, subprocess

          config=json.load(open("infrastructure/environments/production.local.json"))
          project=config["projectId"]
          terraform_sa=config["terraform"]["terraform_service_account_email"]
          build_sa=config["production"]["buildIdentity"]
          deploy_sa=config["production"]["deployIdentity"]
          source_bucket=config["production"]["buildSourceBucket"]
          region=config["terraform"]["region"]
          repository=config["production"]["imageRepository"].split("/")[2]

          def g(*args):
              cmd=["gcloud",*args,
                   "--project="+project,
                   "--impersonate-service-account="+terraform_sa,
                   "--quiet","--format=json"]
              result=subprocess.run(cmd,text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
              if result.returncode:
                  print("STAGE4_BUILD_PREFLIGHT_LOOKUP_FAIL="+args[0],flush=True)
                  raise SystemExit("Unable to verify immutable-build prerequisites safely.")
              return json.loads(result.stdout or "{}")

          def has(policy,role,member):
              return any(
                  binding.get("role")==role and member in binding.get("members",[])
                  for binding in policy.get("bindings",[])
              )

          project_policy=g("projects","get-iam-policy",project)
          build_policy=g("iam","service-accounts","get-iam-policy",build_sa)
          deploy_policy=g("iam","service-accounts","get-iam-policy",deploy_sa)
          source_policy=g("storage","buckets","get-iam-policy","gs://"+source_bucket)
          repo_policy=g("artifacts","repositories","get-iam-policy",repository,"--location="+region)

          build_member="serviceAccount:"+build_sa
          deploy_member="serviceAccount:"+deploy_sa
          terraform_member="serviceAccount:"+terraform_sa

          required=[
              ("project deploy cloudbuild editor",has(project_policy,"roles/cloudbuild.builds.editor",deploy_member)),
              ("project deploy service usage",has(project_policy,"roles/serviceusage.serviceUsageConsumer",deploy_member)),
              ("project deploy build-log viewer",has(project_policy,"roles/logging.viewer",deploy_member)),
              ("project deploy bucket metadata viewer",has(project_policy,"roles/storage.bucketViewer",deploy_member)),
              ("project build logging",has(project_policy,"roles/logging.logWriter",build_member)),
              ("project build service usage",has(project_policy,"roles/serviceusage.serviceUsageConsumer",build_member)),
              ("deploy impersonation by terraform",has(deploy_policy,"roles/iam.serviceAccountTokenCreator",terraform_member)),
              ("build actAs by deploy",has(build_policy,"roles/iam.serviceAccountUser",deploy_member)),
              ("source upload by deploy",has(source_policy,"roles/storage.objectAdmin",deploy_member)),
              ("source read by build",has(source_policy,"roles/storage.objectViewer",build_member)),
              ("artifact push by build",has(repo_policy,"roles/artifactregistry.writer",build_member)),
          ]
          missing=[label for label,ok in required if not ok]
          if missing:
              print("STAGE4_BUILD_PREFLIGHT=blocked",flush=True)
              for label in missing:
                  print("STAGE4_BUILD_MISSING="+label,flush=True)
              raise SystemExit(
                  "Immutable build bootstrap prerequisites are incomplete. "
                  "Run the reviewed scripts/stage4/bootstrap.py supporting-resource plan before retrying."
              )
          print("STAGE4_BUILD_PREFLIGHT=success",flush=True)
          PY
      - name: Diagnose plan prerequisites without exposing secrets
        if: needs.request.outputs.action == 'plan'
        env:
          TERRAFORM_SA: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}
          PROJECT_ID: ${{ vars.GCP_PRODUCTION_PROJECT_ID }}
        run: |
          set -uo pipefail
          failures=0
          check() {
            local label="$1"
            shift
            if "$@" >/dev/null 2>&1; then
              echo "PLAN_DIAGNOSTIC PASS: $label"
            else
              echo "PLAN_DIAGNOSTIC FAIL: $label"
              failures=$((failures + 1))
            fi
          }

          DEPLOY_SA="proinspect-prod-deploy@business-plan-applicatio-17047.iam.gserviceaccount.com"
          STATE_BUCKET="business-plan-applicatio-17047-proinspect-tfstate"
          EVIDENCE_BUCKET="business-plan-applicatio-17047-proinspect-release-evidence"
          BACKUP_BUCKET="business-plan-applicatio-17047-proinspect-migration-backups"
          SERVICE="proinspect-booking-portal-application"
          REGION="europe-west1"

          check "Terraform self impersonation" gcloud auth print-access-token --impersonate-service-account="$TERRAFORM_SA"
          check "Deploy identity impersonation" gcloud auth print-access-token --impersonate-service-account="$DEPLOY_SA"
          check "State bucket read" gcloud storage buckets describe "gs://$STATE_BUCKET" --impersonate-service-account="$TERRAFORM_SA"
          check "Evidence bucket read" gcloud storage buckets describe "gs://$EVIDENCE_BUCKET" --impersonate-service-account="$TERRAFORM_SA"
          check "Backup bucket read" gcloud storage buckets describe "gs://$BACKUP_BUCKET" --impersonate-service-account="$TERRAFORM_SA"
          check "Cloud Run describe as deploy" gcloud run services describe "$SERVICE" --region="$REGION" --project="$PROJECT_ID" --impersonate-service-account="$DEPLOY_SA"
          check "Cloud Run IAM read as Terraform" gcloud run services get-iam-policy "$SERVICE" --region="$REGION" --project="$PROJECT_ID" --impersonate-service-account="$TERRAFORM_SA"
          check "Encryption secret metadata" gcloud secrets versions describe 1 --secret=proinspect-production-access-data-encryption-key --project="$PROJECT_ID" --impersonate-service-account="$TERRAFORM_SA"
          check "Encryption secret payload access" gcloud secrets versions access 1 --secret=proinspect-production-access-data-encryption-key --project="$PROJECT_ID" --impersonate-service-account="$TERRAFORM_SA"
          check "Project inventory" gcloud projects describe "$PROJECT_ID" --impersonate-service-account="$TERRAFORM_SA"
          check "Enabled-service inventory" gcloud services list --enabled --project="$PROJECT_ID" --impersonate-service-account="$TERRAFORM_SA"
          check "Bucket inventory" gcloud storage buckets list --project="$PROJECT_ID" --impersonate-service-account="$TERRAFORM_SA"
          check "Service-account inventory" gcloud iam service-accounts list --project="$PROJECT_ID" --impersonate-service-account="$TERRAFORM_SA"
          check "Secret inventory" gcloud secrets list --project="$PROJECT_ID" --impersonate-service-account="$TERRAFORM_SA"
          check "Firestore database inventory" gcloud firestore databases list --project="$PROJECT_ID" --impersonate-service-account="$TERRAFORM_SA"
          check "Artifact Registry inventory" gcloud artifacts repositories list --location="$REGION" --project="$PROJECT_ID" --impersonate-service-account="$TERRAFORM_SA"
          check "Cloud Run inventory" gcloud run services list --region="$REGION" --project="$PROJECT_ID" --impersonate-service-account="$TERRAFORM_SA"
          check "Global Cloud Build trigger inventory" gcloud builds triggers list --region=global --project="$PROJECT_ID" --impersonate-service-account="$TERRAFORM_SA"
          check "Regional Cloud Build trigger inventory" gcloud builds triggers list --region="$REGION" --project="$PROJECT_ID" --impersonate-service-account="$TERRAFORM_SA"

          if [ "$failures" -ne 0 ]; then
            echo "PLAN_DIAGNOSTIC: $failures prerequisite check(s) failed; plan execution is intentionally stopped."
            exit 1
          fi
          echo "PLAN_DIAGNOSTIC: all non-secret prerequisite checks passed."

      - name: Diagnose Stage 4 controller internals safely
        if: needs.request.outputs.action == 'plan'
        env:
          TERRAFORM_SA: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}
          PROJECT_ID: ${{ vars.GCP_PRODUCTION_PROJECT_ID }}
        run: |
          set -uo pipefail
          failures=0
          mark() {
            local label="$1"
            local status="$2"
            if [ "$status" -eq 0 ]; then
              echo "CONTROLLER_DIAGNOSTIC PASS: $label"
            else
              echo "CONTROLLER_DIAGNOSTIC FAIL: $label"
              failures=$((failures + 1))
            fi
          }

          EVIDENCE_BUCKET="business-plan-applicatio-17047-proinspect-release-evidence"
          STATE_BUCKET="business-plan-applicatio-17047-proinspect-tfstate"
          DATABASE="ai-studio-7242850f-c156-4268-aeb7-c8d47ff6931a"
          PROJECT_NUMBER="696236368989"
          WIF_POOL="proinspect-property-services"
          WIF_PROVIDER="github"

          TOKEN="$(gcloud auth print-access-token --impersonate-service-account="$TERRAFORM_SA" 2>/dev/null)"

          check_http() {
            local label="$1"
            local url="$2"
            local allowed="$3"
            local code
            code="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}'               -H "Authorization: Bearer $TOKEN"               -H "Content-Type: application/json"               "$url" 2>/dev/null || true)"
            if echo ",$allowed," | grep -q ",$code,"; then
              echo "CONTROLLER_DIAGNOSTIC PASS: $label (HTTP $code)"
            else
              echo "CONTROLLER_DIAGNOSTIC FAIL: $label (HTTP ${code:-none})"
              failures=$((failures + 1))
            fi
          }

          BASE="https://firestore.googleapis.com/v1/projects/$PROJECT_ID/databases/$DATABASE"
          check_http "Firestore composite-index REST inventory" "$BASE/collectionGroups/-/indexes" "200"
          check_http "Firestore backup-schedule REST inventory" "$BASE/backupSchedules" "200"
          check_http "Firebase project REST inventory" "https://firebase.googleapis.com/v1beta1/projects/$PROJECT_ID" "200,404"
          check_http "Firebase web-app REST inventory" "https://firebase.googleapis.com/v1beta1/projects/$PROJECT_ID/webApps" "200,404"
          check_http "WIF pool REST inventory" "https://iam.googleapis.com/v1/projects/$PROJECT_NUMBER/locations/global/workloadIdentityPools/$WIF_POOL" "200,404"
          check_http "WIF provider REST inventory" "https://iam.googleapis.com/v1/projects/$PROJECT_NUMBER/locations/global/workloadIdentityPools/$WIF_POOL/providers/$WIF_PROVIDER" "200,404"
          check_http "Firestore rules release REST inventory" "https://firebaserules.googleapis.com/v1/projects/$PROJECT_ID/releases/cloud.firestore/$DATABASE" "200,404"
          check_http "Custom gateway role REST inventory" "https://iam.googleapis.com/v1/projects/$PROJECT_ID/roles/proinspectGatewayPolicy" "200,404"
          check_http "Firestore index field-override REST inventory" "$BASE/collectionGroups/-/fields?filter=indexConfig.usesAncestorConfig%3Afalse" "200"
          check_http "Firestore TTL field-override REST inventory" "$BASE/collectionGroups/-/fields?filter=ttlConfig%3A%2A" "200"

          TMP_FILE="$(mktemp)"
          printf '%s\n' "stage4-controller-diagnostic:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT" > "$TMP_FILE"
          TEST_OBJECT="gs://$EVIDENCE_BUCKET/stage4/diagnostics/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.txt"
          gcloud storage cp "$TMP_FILE" "$TEST_OBJECT"             --if-generation-match=0             --project="$PROJECT_ID"             --impersonate-service-account="$TERRAFORM_SA"             --quiet >/dev/null 2>&1
          cp_status=$?
          mark "Evidence checkpoint conditional object create" "$cp_status"
          if [ "$cp_status" -eq 0 ]; then
            gcloud storage rm "$TEST_OBJECT"               --project="$PROJECT_ID"               --impersonate-service-account="$TERRAFORM_SA"               --quiet >/dev/null 2>&1
            mark "Evidence checkpoint diagnostic cleanup" "$?"
          fi
          rm -f "$TMP_FILE"

          export TF_DATA_DIR="/tmp/stage4-controller-terraform-data"
          export GOOGLE_IMPERSONATE_SERVICE_ACCOUNT="$TERRAFORM_SA"
          rm -rf "$TF_DATA_DIR"
          terraform -chdir=infrastructure init             -input=false             -reconfigure             -lockfile=readonly             -backend-config="bucket=$STATE_BUCKET"             -backend-config="prefix=booking-portal/production"             -backend-config="impersonate_service_account=$TERRAFORM_SA"             >/dev/null 2>&1
          tf_init_status=$?
          mark "Terraform GCS backend init" "$tf_init_status"

          if [ "$tf_init_status" -eq 0 ]; then
            terraform -chdir=infrastructure state list >/dev/null 2>&1
            mark "Terraform state list" "$?"
          fi

          if [ "$failures" -ne 0 ]; then
            echo "CONTROLLER_DIAGNOSTIC: $failures internal check(s) failed; plan execution is intentionally stopped."
            exit 1
          fi
          echo "CONTROLLER_DIAGNOSTIC: all controller-internal checks passed."

      - name: Execute the explicitly requested production phase
        if: needs.request.outputs.action != 'federation'
        env:
          TERRAFORM_SA: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [ "$ACTION" = readiness ]; then
            gcloud projects describe business-plan-applicatio-17047 \
              --impersonate-service-account="$TERRAFORM_SA" \
              --format='value(projectId)'
            echo "Production environment and keyless authentication checked. No deployment or migration executed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          RECEIPT=()
          if [ -f private-evidence/stage4-operator.private.json ]; then
            RECEIPT=(--receipt private-evidence/stage4-operator.private.json)
          fi
          if [ "$ACTION" = plan ]; then
            python3 - <<'PY'
          import sys
          sys.path.insert(0, "scripts/stage4")
          import release

          config_path = "infrastructure/environments/production.local.json"
          phase = {"name": "config"}

          import os, re, subprocess

          original_tf = release.tf
          def traced_tf(c, *args, **kwargs):
              command = args[0] if args else "unknown"
              phase["name"] = "terraform-" + command
              print("STAGE4_PLAN_PHASE_START=" + phase["name"], flush=True)
              try:
                  result = original_tf(c, *args, **kwargs)
              except RuntimeError:
                  print("STAGE4_PLAN_PHASE_FAIL=" + phase["name"], flush=True)
                  if command == "plan":
                      env={**os.environ,
                           "TF_DATA_DIR":str(release.workspace(c)/"terraform-data"),
                           "GOOGLE_IMPERSONATE_SERVICE_ACCOUNT":c["terraform"]["terraform_service_account_email"]}
                      probe_args=["terraform","-chdir=infrastructure",*args]
                      if "-no-color" not in probe_args:
                          probe_args.append("-no-color")
                      probe=subprocess.run(probe_args,cwd=release.ROOT,text=True,
                                           stdout=subprocess.PIPE,stderr=subprocess.PIPE,env=env)
                      raw=(probe.stderr or probe.stdout or "")
                      raw=re.sub(r"ya29\\.[A-Za-z0-9._-]+","[REDACTED_TOKEN]",raw)
                      raw=re.sub(r"eyJ[A-Za-z0-9_-]{20,}\\.[A-Za-z0-9_-]{20,}\\.[A-Za-z0-9_-]{20,}","[REDACTED_JWT]",raw)
                      raw=re.sub(r"(?i)(authorization\\s*[:=]\\s*)([^\\s]+)",r"\\1[REDACTED]",raw)
                      raw=re.sub(r"(?<![A-Za-z0-9])[A-Za-z0-9+/]{120,}={0,2}(?![A-Za-z0-9])","[REDACTED_LONG_VALUE]",raw)
                      lines=[line for line in raw.splitlines() if line.strip()]
                      print("STAGE4_TERRAFORM_PLAN_DIAGNOSTIC_BEGIN", flush=True)
                      for line in lines[-120:]:
                          print(line[:1200], flush=True)
                      print("STAGE4_TERRAFORM_PLAN_DIAGNOSTIC_END", flush=True)
                  raise
              print("STAGE4_PLAN_PHASE_PASS=" + phase["name"], flush=True)
              return result

          release.tf = traced_tf
          try:
              c = release.config(config_path)
              phase["name"] = "exact-source-ci"
              release.verify_ci(c["sourceSha"])
              phase["name"] = "github-production-policy"
              release.validate_environment(
                  release.github("/environments/production"),
                  release.github("/environments/production/deployment-branch-policies"),
              )
              phase["name"] = "checkpoint-session-open"
              with release.session(c):
                  phase["name"] = "plan-body"
                  release.plan(c)
                  phase["name"] = "checkpoint-persist"
              print("STAGE4_PLAN_TRACE=success", flush=True)
          except Exception as error:
              print("STAGE4_PLAN_TRACE=failed", flush=True)
              print("STAGE4_PLAN_LAST_PHASE=" + phase["name"], flush=True)
              print("STAGE4_PLAN_ERROR_TYPE=" + type(error).__name__, flush=True)
              raise
          PY
            exit 0
          fi

          python3 scripts/stage4/release.py "$ACTION" \
            --config infrastructure/environments/production.local.json \
            --approve "$APPROVAL" "${RECEIPT[@]}"
      - name: Diagnose failed immutable Cloud Build safely
        if: failure() && needs.request.outputs.action == 'build'
        env:
          TERRAFORM_SA: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}
          PROJECT_ID: ${{ vars.GCP_PRODUCTION_PROJECT_ID }}
        run: |
          python3 - <<'PY'
          import json, subprocess

          config=json.load(open("infrastructure/environments/production.local.json"))
          project=config["projectId"]
          terraform_sa=config["terraform"]["terraform_service_account_email"]
          source_sha=config["sourceSha"]
          build_sa=config["production"]["buildIdentity"]

          cmd=[
              "gcloud","builds","list",
              "--project="+project,
              "--impersonate-service-account="+terraform_sa,
              "--limit=25","--sort-by=~createTime","--quiet","--format=json",
          ]
          result=subprocess.run(cmd,text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
          if result.returncode:
              print("STAGE4_BUILD_DIAGNOSTIC=lookup-failed")
              raise SystemExit(0)

          builds=json.loads(result.stdout or "[]")
          matches=[]
          for build in builds:
              service_account=str(build.get("serviceAccount",""))
              substitutions=build.get("substitutions") or {}
              if service_account.endswith("/serviceAccounts/"+build_sa) and substitutions.get("_SOURCE_SHA")==source_sha:
                  matches.append(build)

          if not matches:
              print("STAGE4_BUILD_DIAGNOSTIC=no-matching-build")
              raise SystemExit(0)

          build=matches[0]
          safe={
              "id":build.get("id"),
              "status":build.get("status"),
              "statusDetail":build.get("statusDetail"),
              "failureInfo":build.get("failureInfo"),
              "createTime":build.get("createTime"),
              "startTime":build.get("startTime"),
              "finishTime":build.get("finishTime"),
              "logUrl":build.get("logUrl"),
              "steps":[
                  {
                      "id":step.get("id"),
                      "name":step.get("name"),
                      "status":step.get("status"),
                      "exitCode":step.get("exitCode"),
                  }
                  for step in build.get("steps",[])
              ],
          }
          print("STAGE4_BUILD_DIAGNOSTIC="+json.dumps(safe,sort_keys=True,separators=(",",":")))
          PY
      - name: Diagnose failed maintenance revision safely
        if: failure() && needs.request.outputs.action == 'maintenance'
        env:
          TERRAFORM_SA: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}
        run: |
          set +e
          gcloud run services describe proinspect-booking-portal-application \
            --region=europe-west1 \
            --project=business-plan-applicatio-17047 \
            --impersonate-service-account="$TERRAFORM_SA" \
            --format=json > /tmp/stage4-service.json
          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path("/tmp/stage4-service.json")
          if not p.exists() or not p.read_text().strip():
              print("STAGE4_MAINT_DIAGNOSTIC=service-lookup-failed")
              raise SystemExit(0)
          service=json.loads(p.read_text())
          status=service.get("status") or {}
          latest=status.get("latestCreatedRevisionName")
          print("STAGE4_MAINT_LATEST_CREATED="+str(latest or ""))
          print("STAGE4_MAINT_LATEST_READY="+str(status.get("latestReadyRevisionName") or ""))
          print("STAGE4_MAINT_TRAFFIC="+json.dumps([
              {"revisionName":x.get("revisionName"),"percent":x.get("percent"),"tag":x.get("tag")}
              for x in status.get("traffic",[])
          ],sort_keys=True,separators=(",",":")))
          if latest:
              pathlib.Path("/tmp/stage4-latest-revision.txt").write_text(latest)
          PY
          if [ -s /tmp/stage4-latest-revision.txt ]; then
            REVISION="$(cat /tmp/stage4-latest-revision.txt)"
            gcloud run revisions describe "$REVISION" \
              --region=europe-west1 \
              --project=business-plan-applicatio-17047 \
              --impersonate-service-account="$TERRAFORM_SA" \
              --format=json > /tmp/stage4-revision.json
            python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path("/tmp/stage4-revision.json")
          if not p.exists() or not p.read_text().strip():
              raise SystemExit(0)
          revision=json.loads(p.read_text())
          status=revision.get("status") or {}
          safe={
              "createdAt":(revision.get("metadata") or {}).get("creationTimestamp"),
              "conditions":[
                  {k:item.get(k) for k in ("type","status","reason","message")}
                  for item in status.get("conditions",[])
              ]
          }
          spec=revision.get("spec") or {}
          containers=spec.get("containers") or []
          if containers:
              safe["probes"]={
                  "startupProbe":containers[0].get("startupProbe"),
                  "livenessProbe":containers[0].get("livenessProbe"),
                  "readinessProbe":containers[0].get("readinessProbe"),
              }
          print("STAGE4_MAINT_DIAGNOSTIC="+json.dumps(safe,sort_keys=True,separators=(",",":")))
          PY
          fi
      - name: Remove runner-only private configuration
        if: always()
        run: |
          rm -f infrastructure/environments/production.local.json private-evidence/stage4-operator.private.json
# Operational evidence is stored only in the protected GCS checkpoint bucket.
