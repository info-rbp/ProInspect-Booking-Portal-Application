name: Stage 1 branch review

on:
  push:
    branches: [Admin-Portal]

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Archive review baselines without executing application code
        run: |
          mkdir -p evidence
          git archive --format=zip HEAD -o evidence/admin-source.zip
          git rev-parse HEAD > evidence/admin-source-sha.txt
          git archive --format=zip e204c6488ec353bab99a3df01cb55406c4944cf7 -o evidence/tenant-source.zip
          git archive --format=zip 6a55131f5890b82047d8b78d2af2bdc6f140041f -o evidence/main-source.zip
          git clone --no-checkout https://github.com/info-rbp/Property-Report-Tool.git /tmp/report-review
          git -C /tmp/report-review archive --format=zip cc6bdaed35727e3778424b00a77f82c55bacf8c6 -o "$GITHUB_WORKSPACE/evidence/report-source.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: stage1-source
          path: evidence/*
          retention-days: 3
          if-no-files-found: error
