name: Stage 3 isolated workspace
on:
  push:
    branches: [release/platform-unification]
    paths: [.github/workflows/stage3-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - name: Prepare source and isolated verification dependencies
        run: |
          set -euo pipefail
          npm ci
          mkdir -p /tmp/stage3-workspace/tools
          git bundle create /tmp/stage3-workspace/source.bundle --all
          cp "$(command -v terraform)" /tmp/stage3-workspace/tools/terraform
          tar -czf /tmp/stage3-workspace/node_modules.tgz node_modules
          npm install --prefix /tmp/stage3-firebase --no-audit --no-fund firebase-tools@14.2.1
          tar -czf /tmp/stage3-workspace/firebase-tools.tgz -C /tmp/stage3-firebase .
          echo "$GITHUB_SHA" > /tmp/stage3-workspace/SOURCE_SHA
      - uses: actions/upload-artifact@v4
        with:
          name: stage3-isolated-workspace
          path: /tmp/stage3-workspace/
          retention-days: 1
          compression-level: 0
