name: Cloudflare pivot readiness
on:
  push:
    branches: [release/cloudflare-platform]
    paths: [.github/workflows/cloudflare-pivot-readiness.yml]
permissions:
  contents: read
jobs:
  freeze-legacy-cutover:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Cancel and disable only legacy Stage 3/4 deployment workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          repo = os.environ['REPO']
          base = 'https://api.github.com/repos/' + repo
          def api(path, method='GET'):
              req = urllib.request.Request(base + path, method=method, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(req) as r:
                  body = r.read()
                  return json.loads(body) if body else None
          selected = {'.github/workflows/stage4-production.yml', '.github/workflows/stage3-live-staging.yml'}
          for w in api('/actions/workflows?per_page=100')['workflows']:
              if w['path'] not in selected:
                  continue
              for run in api('/actions/workflows/' + str(w['id']) + '/runs?per_page=100')['workflow_runs']:
                  if run['status'] in ('queued', 'waiting', 'in_progress', 'pending', 'requested'):
                      api('/actions/runs/' + str(run['id']) + '/cancel', 'POST')
                      print('Cancel requested:', run['id'])
              api('/actions/workflows/' + str(w['id']) + '/disable', 'PUT')
              print('Disabled legacy deployment workflow:', w['path'])
          print('No Cloud Run, database, storage, IAM or DNS mutation performed.')
          PY
  account-readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Report only presence of Cloudflare deployment credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import os
          for key in ['CF_TOKEN','CF_ACCOUNT']:
              print(key + '=' + ('configured' if os.environ.get(key) else 'missing'))
          PY
