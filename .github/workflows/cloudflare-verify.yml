name: Verify Cloudflare platform
on:
  push:
    branches: [release/cloudflare-platform]
  pull_request:
    branches: [release/cloudflare-platform]
permissions:
  contents: read
concurrency:
  group: cloudflare-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  adapt-browser:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      source: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Commit deterministic browser import migration on the Cloudflare branch only
        id: source
        run: |
          python3 scripts/cloudflare/adapt-browser.py
          git add src
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'refactor(cloudflare): switch preserved portals to native sessions'
            git push origin HEAD:release/cloudflare-platform
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: adapt-browser
    if: always() && (needs.adapt-browser.result == 'success' || github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.adapt-browser.outputs.source || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Require committed browser migration and exact schema
        run: |
          python3 scripts/cloudflare/adapt-browser.py
          git diff --exit-code -- src
          npm run cloudflare:schema
      - name: Verify security, transactional persistence and deterministic migration
        run: npm run cloudflare:test
      - name: Type check preserved application and Cloudflare boundaries
        run: npm run lint
      - name: Build actual portals and Google-free Worker
        run: npm run cloudflare:build
      - name: Validate Worker upload without an account deployment
        run: npx --yes wrangler@4 deploy --dry-run --outdir .cloudflare/dry-run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloudflare-build-evidence
          path: .cloudflare/bundle-audit.json
          if-no-files-found: ignore
          retention-days: 14
