name: Stage 3 reviewed source publication
on:
  push:
    branches: [release/platform-unification]
    paths: [.github/workflows/stage3-complete-reviewed.yml]
permissions:
  contents: write
jobs:
  publish-objects:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reconstruct already-tested source and publish non-workflow Git objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/release/platform-unification
          git merge-base --is-ancestor fc9a6c68e59919181c6715d1af2bbee93470956a HEAD
          python3 - <<'PY'
          import hashlib,json,lzma,os,shutil,subprocess,urllib.request,urllib.error
          from pathlib import Path
          root=Path.cwd()
          raw=lzma.decompress(b''.join((root/f'.stage3-reviewed-transfer/part{i}').read_bytes() for i in range(5)))
          assert hashlib.sha256(raw).hexdigest()=='84a3cefd248f64710a43cf2204eed7bc06aa7dfe4b06737a4b06d8182586631b'
          prepared=[]
          for item in json.loads(raw):
              path=root/item['path']
              assert path.resolve().is_relative_to(root) and '.git' not in path.parts
              old=path.read_bytes() if path.exists() else None
              assert (hashlib.sha256(old).hexdigest() if old is not None else None)==item['before'],item['path']
              new=None
              if item['after'] is not None:
                  lines=(old.decode('utf-8') if old is not None else '').splitlines(keepends=True)
                  for start,end,insert in reversed(item['edits']):lines[start:end]=insert
                  new=''.join(lines).encode('utf-8')
                  assert hashlib.sha256(new).hexdigest()==item['after'],item['path']
              prepared.append((path,new))
          for path,new in prepared:
              if new is None:path.unlink()
              else:
                  path.parent.mkdir(parents=True,exist_ok=True)
                  path.write_bytes(new)
          shutil.rmtree(root/'.stage3-reviewed-transfer')
          (root/'.github/workflows/stage3-complete-reviewed.yml').unlink()
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          git('add','-A')
          assert git('write-tree')=='784a2fa5793fd75910e8414ac94dcefce544ef86','Reviewed source differs from tested local tree.'
          repo=os.environ['GITHUB_REPOSITORY']
          assert repo=='info-rbp/ProInspect-Booking-Portal-Application'
          def api(path,data=None):
              request=urllib.request.Request('https://api.github.com/repos/'+repo+path,data=json.dumps(data).encode() if data is not None else None,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(request,timeout=60) as response:return json.load(response)
              except urllib.error.HTTPError as error:
                  print('Git object publication failed:',error.code,error.read().decode());raise
          parent=git('rev-parse','HEAD')
          assert api('/git/ref/heads/release/platform-unification')['object']['sha']==parent,'Concurrent branch movement.'
          entries=[]
          for name in git('diff','--cached','--name-only','HEAD').splitlines():
              if name.startswith('.github/'):continue
              path=Path(name);entry={'path':name,'mode':'100644','type':'blob'}
              if path.exists():entry['content']=path.read_text()
              else:entry['sha']=None
              entries.append(entry)
          tree=api('/git/trees',{'base_tree':git('rev-parse','HEAD^{tree}'),'tree':entries})
          result={'treeSha':tree['sha'],'parentSha':parent,'testedCompleteTreeSha':'784a2fa5793fd75910e8414ac94dcefce544ef86','validationRun':36433175892,'branchUpdated':False,'workflowFilesAwaitConnectorPublication':True}
          Path('/tmp/stage3-reviewed-tree.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage3-reviewed-tree
          path: /tmp/stage3-reviewed-tree.json
          retention-days: 7
          if-no-files-found: error
