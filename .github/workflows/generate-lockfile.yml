name: Generate npm lockfile

on:
  push:
    branches:
      - cloud-run-migration

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: cloud-run-migration
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit package lock
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: add deterministic npm lockfile"
          git push origin HEAD:cloud-run-migration
