name: Verify booking portal

on:
  push:
    branches:
      - main
      - cloud-run-migration
      - tenant-portal
      - release/platform-unification
      - stage3/infrastructure-rehearsal
  pull_request:
    branches:
      - main
      - release/platform-unification

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Set up Java for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm ci
      - name: Runtime dependency security gate
        run: npm audit --omit=dev --audit-level=high
      - name: Type check
        run: npm run lint
      - name: Architecture and portal-isolation freeze gate
        run: npm run freeze:check
      - name: Verify migration dry-run is read-only
        timeout-minutes: 8
        env:
          FIREBASE_PROJECT_ID: demo-platform-stage2
          GCLOUD_PROJECT: demo-platform-stage2
          FIRESTORE_DATABASE_ID: '(default)'
        run: npx --yes firebase-tools@14.2.1 emulators:exec --only firestore --project demo-platform-stage2 --config scripts/stage1-firebase.json 'npm run test:migration-preflight'
      - name: Stage 2 integration architecture gate
        run: npm run stage2:check
      - name: Stage 3 safety and migration unit regressions
        run: npm run stage3:test
      - name: Stage 3 Firestore apply/reconciliation/rollback rehearsal
        timeout-minutes: 8
        run: npx --yes firebase-tools@14.2.1 emulators:exec --only firestore --project demo-stage3 --config firebase.stage3.json 'npm run stage3:test:emulator'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - name: Terraform formatting and provider validation
        run: |
          terraform -chdir=infrastructure fmt -check -recursive
          terraform -chdir=infrastructure init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infrastructure validate
          terraform -chdir=infrastructure test
      - name: Build
        run: npm run build
      - name: Build production container image
        run: docker build -t proinspect-booking-portal:verify .
      - name: Stage 3 exact-source evidence
        run: |
          mkdir -p .stage3
          git rev-parse HEAD > .stage3/verified-source-sha.txt
          node --input-type=module -e "import {codeHash} from './scripts/stage3/migrate.mjs'; console.log(codeHash())" > .stage3/migration-code-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: stage3-repository-verification-${{ github.sha }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .stage3/verified-source-sha.txt
            .stage3/migration-code-sha256.txt
          retention-days: 30
      - name: Record exact tested commit
        if: always()
        run: git rev-parse HEAD > stage2-platform-unification-sha.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage2-platform-unification-evidence
          path: stage2-platform-unification-sha.txt
          retention-days: 14
          if-no-files-found: error
