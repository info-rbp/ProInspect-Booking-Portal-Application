name: Verify booking portal

on:
  push:
    branches: [main, cloud-run-migration, tenant-portal, release/platform-unification]
  pull_request:
    branches: [main, release/platform-unification]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Retain tracked public source and ancestry only
        run: |
          git bundle create /tmp/release-source.bundle HEAD
          git rev-parse HEAD > /tmp/release-source-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-source-provenance
          path: |
            /tmp/release-source.bundle
            /tmp/release-source-sha.txt
          retention-days: 14
          if-no-files-found: error
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact source and ancestry
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - name: Install locked dependencies
        run: npm ci
      - name: Runtime dependency security gate
        run: npm audit --omit=dev --audit-level=high
      - name: TypeScript, architecture and Stage 3 contract
        run: |
          npm run lint
          npm run freeze:check
          npm run stage2:check
          npm run stage3:check
      - name: Offline infrastructure and control-plane regressions
        run: |
          terraform fmt -check -recursive infrastructure
          terraform -chdir=infrastructure init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infrastructure validate
          terraform -chdir=infrastructure test -no-color
          npm run stage3:test:controls
      - name: Original migration dry-run immutability
        timeout-minutes: 8
        env:
          FIREBASE_PROJECT_ID: demo-platform-stage2
          GCLOUD_PROJECT: demo-platform-stage2
          FIRESTORE_DATABASE_ID: '(default)'
        run: npx --yes firebase-tools@14.2.1 emulators:exec --only firestore --project demo-platform-stage2 --config firebase.ci.json 'npm run test:migration-preflight'
      - name: Atomic migration and integration regressions
        timeout-minutes: 8
        env:
          FIREBASE_PROJECT_ID: demo-stage3-atomic
          GCLOUD_PROJECT: demo-stage3-atomic
          FIRESTORE_DATABASE_ID: '(default)'
        run: npx --yes firebase-tools@14.2.1 emulators:exec --only firestore --project demo-stage3-atomic --config firebase.ci.json 'npm run stage3:test'
      - name: Build application and production container
        run: |
          npm run build
          docker build -t proinspect-booking-portal:verify .
      - name: Record successful exact-source repository acceptance
        run: |
          git rev-parse HEAD > stage2-platform-unification-sha.txt
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          evidence = {'schemaVersion':1,'status':'passed','sourceSha':os.environ['GITHUB_SHA'],'runId':os.environ['GITHUB_RUN_ID'],'synthetic':True,'scope':'repository acceptance only','liveCloudAcceptance':False,'completedAt':datetime.now(timezone.utc).isoformat()}
          open('stage3-repository-evidence.json','w').write(json.dumps(evidence,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage2-platform-unification-evidence
          path: stage2-platform-unification-sha.txt
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: stage3-repository-acceptance
          path: stage3-repository-evidence.json
          retention-days: 14
          if-no-files-found: error
