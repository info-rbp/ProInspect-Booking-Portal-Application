name: Verify booking portal

on:
  push:
    branches:
      - main
      - cloud-run-migration
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate migration lockfile when missing
        if: github.ref_name == 'cloud-run-migration'
        shell: bash
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "build: add deterministic npm lockfile"
            git push origin HEAD:cloud-run-migration
          fi
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Build production container image
        run: docker build -t proinspect-booking-portal:verify .
