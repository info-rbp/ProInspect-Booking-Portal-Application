name: Verify booking portal

on:
  push:
    branches:
      - main
      - cloud-run-migration
      - client-portal
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Check Terraform formatting
        run: terraform -chdir=infrastructure fmt -check -recursive
      - name: Initialise Terraform without remote backend
        run: terraform -chdir=infrastructure init -backend=false -input=false
      - name: Validate Terraform
        run: terraform -chdir=infrastructure validate
      - name: Build production container image
        run: docker build -t proinspect-booking-portal:verify .
