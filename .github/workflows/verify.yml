name: Verify booking portal

on:
  push:
    branches:
      - main
      - cloud-run-migration
      - Admin-Portal
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Build production container image
        run: docker build -t proinspect-booking-portal:verify .
