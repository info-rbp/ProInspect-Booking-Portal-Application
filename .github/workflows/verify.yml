name: Verify booking portal

on:
  push:
    branches:
      - main
      - cloud-run-migration
      - tenant-portal
      - release/platform-unification
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Java for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm ci
      - name: Runtime dependency security gate
        run: npm audit --omit=dev --audit-level=high
      - name: Type check
        run: npm run lint
      - name: Architecture and portal-isolation freeze gate
        run: npm run freeze:check
      - name: Verify migration dry-run is read-only
        timeout-minutes: 8
        env:
          FIREBASE_PROJECT_ID: demo-platform-stage2
          GCLOUD_PROJECT: demo-platform-stage2
          FIRESTORE_DATABASE_ID: '(default)'
        run: npx --yes firebase-tools@latest emulators:exec --only firestore --project demo-platform-stage2 --config scripts/stage1-firebase.json 'npm run test:migration-preflight'
      - name: Stage 2 integration architecture gate
        run: npm run stage2:check
      - name: Build
        run: npm run build
      - name: Build production container image
        run: docker build -t proinspect-booking-portal:verify .
      - name: Record exact tested commit
        if: always()
        run: git rev-parse HEAD > stage2-platform-unification-sha.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage2-platform-unification-evidence
          path: stage2-platform-unification-sha.txt
          retention-days: 14
          if-no-files-found: error
