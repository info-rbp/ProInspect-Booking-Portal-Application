name: Verify booking portal

on:
  push:
    branches: [main, cloud-run-migration, client-portal]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm ci
      - name: Runtime dependency security gate
        run: npm audit --omit=dev --audit-level=high
      - name: Type check
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Migration preflight regression
        run: npx tsx scripts/audit-client-migration.ts --self-test
      - name: Isolated client identity and workflow regression
        timeout-minutes: 8
        env:
          FIREBASE_PROJECT_ID: demo-stage1
          GCLOUD_PROJECT: demo-stage1
          FIRESTORE_DATABASE_ID: '(default)'
          FIREBASE_STORAGE_BUCKET: demo-stage1.appspot.com
        run: npx --yes firebase-tools@latest emulators:exec --only auth,firestore --project demo-stage1 --config scripts/stage1-firebase.json 'npx tsx scripts/verify-stage1.ts'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Check Terraform formatting
        run: terraform -chdir=infrastructure fmt -check -recursive
      - name: Initialise Terraform without remote backend
        run: terraform -chdir=infrastructure init -backend=false -input=false
      - name: Validate Terraform
        run: terraform -chdir=infrastructure validate
      - name: Build production container
        run: docker build -t proinspect-booking-portal:verify .
      - name: Record exact tested commit
        if: always()
        run: git rev-parse HEAD > stage1-source-sha.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-stage1-evidence
          path: |
            stage1-source-sha.txt
            stage1-server.log
          retention-days: 14
          if-no-files-found: error
